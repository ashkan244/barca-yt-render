# Cloud production: (optional) Kokoro narration -> registry -> bundle -> parallel chunk render -> concat
# + thumbnail, chapters and SRT. Trigger: Actions -> "Render video" -> Run workflow.
name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition id (e.g. EP01-PL)
        required: true
        default: EP01-PL
      code:
        description: Narration code to synthesise first (e.g. PL). Empty = use committed audio.
        required: false
        default: ''
      chunks:
        description: Number of parallel render jobs
        required: true
        default: '10'
      crf:
        description: H.264 CRF (lower = higher quality)
        required: true
        default: '20'
      prep:
        description: "Presenter cut + matte: CODE|LINES|NAME (e.g. HK|L01-L03,L41-L46|RS3). Empty = none"
        required: false
        default: ''

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Kokoro model + npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            tools/tts/node_modules/@huggingface/transformers/.cache
          key: tts-${{ hashFiles('tools/tts/package-lock.json') }}
      - name: Restore narration audio cache
        if: ${{ inputs.code != '' }}
        id: audiocache
        uses: actions/cache@v4
        with:
          path: studio/public/audio/${{ inputs.code }}
          key: audio-${{ inputs.code }}-${{ hashFiles(format('studio/src/episodes/narration/{0}.json', inputs.code)) }}
      - name: Narration (Kokoro, local CPU)
        if: ${{ inputs.code != '' && steps.audiocache.outputs.cache-hit != 'true' }}
        working-directory: tools/tts
        run: |
          npm ci --no-audit --no-fund
          node say.mjs ../../studio/src/episodes/narration/${{ inputs.code }}.json ../../studio/public/audio/${{ inputs.code }}
      - name: Install studio
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Decrypt presenter footage (encrypted in repo, key in secrets)
        if: ${{ hashFiles('assets/host/*.enc.part*') != '' }}
        env:
          HOST_KEY: ${{ secrets.HOST_KEY }}
        working-directory: .
        run: |
          for p in $(ls assets/host/*.enc.part000); do f=${p%.part000}; cat "$f".part* > "$f"; b=$(basename "$f" .enc); code=${b%%-*}; mkdir -p studio/public/host/$code
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HOST_KEY -in "$f" -out studio/public/host/$code/$b; done
      - name: Presenter cut + AI matte (Robust Video Matting, CPU)
        if: ${{ inputs.prep != '' }}
        env:
          HOST_KEY: ${{ secrets.HOST_KEY }}
        working-directory: .
        run: |
          IFS='|' read -r CODE LINES NAME <<< "${{ inputs.prep }}"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q onnxruntime numpy
          node tools/host/prep-cut.mjs "$CODE" "$LINES" "studio/public/host/$CODE/$CODE-$NAME.mp4"
          python tools/host/matte.py "studio/public/host/$CODE/$CODE-$NAME.mp4" "studio/public/host/$CODE/$CODE-$NAME-matte.webm"
          mkdir -p prep && tar -C studio/public/host -cf prep/prep.tar "$CODE/$CODE-$NAME.mp4" "$CODE/$CODE-$NAME-matte.webm"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:HOST_KEY -in prep/prep.tar -out prep/prep.tar.enc && rm prep/prep.tar
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.prep != '' }}
        with:
          name: prep-enc
          path: prep/prep.tar.enc
          retention-days: 1
      - name: Registry, bundle, plan, metadata
        id: plan
        working-directory: studio
        run: |
          node scripts/gen-registry.mjs
          npx remotion bundle src/index.ts --out-dir=build
          echo "matrix=$(node scripts/plan-chunks.mjs build '${{ inputs.composition }}' '${{ inputs.chunks }}' | tail -n 1)" >> "$GITHUB_OUTPUT"
          mkdir -p out/meta
          if [ -f "src/episodes/specs/${{ inputs.composition }}.json" ]; then
            node scripts/export-meta.mjs '${{ inputs.composition }}' out/meta
            npx remotion still build '${{ inputs.composition }}-thumb' out/meta/${{ inputs.composition }}-thumb.png --image-format=png || true
          fi
          if [ -n "${{ inputs.code }}" ]; then cp -r public/audio/${{ inputs.code }} out/meta/audio-${{ inputs.code }}; fi
          rm -rf build/public/host build/public/host-raw   # footage never leaves the runner inside an artifact
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: studio/build
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-meta
          path: studio/out/meta
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-post
          path: |
            studio/out/meta
            !studio/out/meta/audio-*
          retention-days: 30

  render:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: studio/build
      - name: Decrypt presenter footage (encrypted in repo, key in secrets)
        if: ${{ hashFiles('assets/host/*.enc.part*') != '' }}
        env:
          HOST_KEY: ${{ secrets.HOST_KEY }}
        working-directory: .
        run: |
          for p in $(ls assets/host/*.enc.part000); do f=${p%.part000}; cat "$f".part* > "$f"; b=$(basename "$f" .enc); code=${b%%-*}; mkdir -p studio/build/public/host/$code
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HOST_KEY -in "$f" -out studio/build/public/host/$code/$b; done
      - uses: actions/download-artifact@v4
        if: ${{ inputs.prep != '' }}
        with:
          name: prep-enc
          path: prep
      - name: Decrypt presenter cut + matte
        if: ${{ inputs.prep != '' }}
        env:
          HOST_KEY: ${{ secrets.HOST_KEY }}
        working-directory: .
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:HOST_KEY -in prep/prep.tar.enc -out prep/prep.tar
          mkdir -p studio/build/public/host && tar -C studio/build/public/host -xf prep/prep.tar && rm prep/prep.tar
      - name: Render chunk ${{ matrix.index }} (frames ${{ matrix.start }}-${{ matrix.end }})
        run: |
          start=$(date +%s)
          npx remotion render build '${{ inputs.composition }}' out/part-${{ matrix.index }}.mp4 \
            --frames=${{ matrix.start }}-${{ matrix.end }} --codec=h264 --crf=${{ inputs.crf }} --audio-codec=aac --audio-bitrate=192k --log=info
          secs=$(( $(date +%s) - start ))
          frames=$(( ${{ matrix.end }} - ${{ matrix.start }} + 1 ))
          echo "chunk ${{ matrix.index }}: ${frames} frames in ${secs}s" | tee out/part-${{ matrix.index }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.index }}
          path: studio/out/part-${{ matrix.index }}.*
          retention-days: 1

  concat:
    needs: render
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: studio/out
          merge-multiple: true
      - name: Concatenate chunks + loudness report
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          cd out
          ls part-*.mp4 | sort -V | sed "s/^/file '/; s/$/'/" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy joined.mp4
          ffmpeg -y -i joined.mp4 -c:v copy -af loudnorm=I=-14:TP=-1.5:LRA=11 -c:a aac -b:a 192k '${{ inputs.composition }}.mp4'
          cat part-*.txt > render-speed.txt
          ffmpeg -hide_banner -i '${{ inputs.composition }}.mp4' -af loudnorm=print_format=summary -f null - 2>&1 | tail -12 >> render-speed.txt || true
          cat render-speed.txt
          ffprobe -v error -show_entries format=duration -of csv=p=0 '${{ inputs.composition }}.mp4' > duration.txt
          ffmpeg -v error -y -i '${{ inputs.composition }}.mp4' -vf 'fps=1/20,scale=384:216,tile=6x8' -frames:v 1 sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}
          path: |
            studio/out/${{ inputs.composition }}.mp4
            studio/out/render-speed.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-qc
          path: |
            studio/out/sheet.png
            studio/out/duration.txt
            studio/out/render-speed.txt
          retention-days: 30

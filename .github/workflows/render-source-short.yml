name: Render source-aligned Short
on:
  workflow_dispatch:
    inputs:
      source_file_id:
        description: Shared Drive source file ID (not a URL or credential)
        required: true
        type: string
      mode:
        description: Preview permits pending review; release requires cleared transcript and assets
        required: true
        default: preview
        type: choice
        options: [preview, release]
      composition:
        description: Layout
        default: CLASICO-SOURCE-ADAPTIVE
        type: choice
        options: [CLASICO-SOURCE-ADAPTIVE, CLASICO-SOURCE-SHORT]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify media-tool checks
        run: python -m unittest discover -s tools/video/tests -v
      - name: Verify episode and build shared captions
        id: episode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python tools/video/episode.py studio/src/episodes-source/clasico-source.manifest.json --mode "$MODE" --build-captions
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          m=json.loads(Path('studio/src/episodes-source/clasico-source.manifest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"sha256={m['source']['sha256']}\nduration={m['duration']}\n")
          PYCODE
      - name: Download and verify the original source
        env:
          SOURCE_FILE_ID: ${{ inputs.source_file_id }}
          SOURCE_SHA256: ${{ steps.episode.outputs.sha256 }}
        run: python tools/video/download_drive.py "$SOURCE_FILE_ID" /tmp/presenter-source.mov --sha256 "$SOURCE_SHA256"
      - name: Prepare media without changing speech timing
        env:
          DURATION: ${{ steps.episode.outputs.duration }}
        run: |
          python tools/video/prepare_source.py /tmp/presenter-source.mov --output-dir studio/public/host/CLASICO
          python tools/video/make_score.py studio/public/host/CLASICO/score.wav --duration "$DURATION"
          python tools/video/episode.py studio/src/episodes-source/clasico-source.manifest.json --check-media
      - name: Install Studio and verify types
        working-directory: studio
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
      - name: Render vertical master
        working-directory: studio
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: |
          CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          if [ -z "$CHROME_PATH" ]; then
            npx remotion browser ensure
            npx remotion render src/index.ts "$COMPOSITION" out/CLASICO-SOURCE-SHORT.render.mp4 --concurrency=2 --crf=18 --codec=h264 --pixel-format=yuv420p --color-space=bt709 --image-format=png --audio-codec=aac --audio-bitrate=192k
          else
            npx remotion render src/index.ts "$COMPOSITION" out/CLASICO-SOURCE-SHORT.render.mp4 --browser-executable="$CHROME_PATH" --concurrency=2 --crf=18 --codec=h264 --pixel-format=yuv420p --color-space=bt709 --image-format=png --audio-codec=aac --audio-bitrate=192k
          fi
          npx remotion still src/index.ts CLASICO-SOURCE-COVER out/CLASICO-SOURCE-COVER.png
          ffmpeg -v error -y -i out/CLASICO-SOURCE-SHORT.render.mp4 -c copy -movflags +faststart out/CLASICO-SOURCE-SHORT.mp4
      - name: QC and posting packet
        env:
          COMPOSITION: ${{ inputs.composition }}
          MODE: ${{ inputs.mode }}
        run: |
          python tools/video/media.py qc studio/out/CLASICO-SOURCE-SHORT.mp4 --profile vertical --decode --loudness --output studio/out/quality.json
          python tools/video/media.py contact-sheet studio/out/CLASICO-SOURCE-SHORT.mp4 --output studio/out/contact-sheet.jpg --interval 5
          cp docs/barca-radar/clasico-source/CLASICO-SOURCE-SHORT.srt studio/out/
          cp docs/barca-radar/clasico-source/posting.en.md studio/out/
          python - <<'PYCODE'
          import hashlib,json,os,sys
          sys.path.insert(0,"tools/video")
          from photos import credits
          from pathlib import Path
          m=json.loads(Path('studio/src/episodes-source/clasico-source.manifest.json').read_text())
          catalog=json.loads(Path('studio/src/production/photo-catalog.json').read_text())
          attribution=credits(catalog,m['photoAssets'])
          Path('studio/out/photo-credits.md').write_text(attribution)
          with Path('studio/out/posting.en.md').open('a') as f: f.write('\n\n'+attribution)
          qc=json.loads(Path('studio/out/quality.json').read_text())
          output=Path('studio/out/CLASICO-SOURCE-SHORT.mp4')
          with output.open('rb') as f: checksum=hashlib.file_digest(f,'sha256').hexdigest()
          run=f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          delivery=dict(composition=os.environ['COMPOSITION'],mode=os.environ['MODE'],renderCommit=os.environ['GITHUB_SHA'],runUrl=run,sha256=checksum,bytes=output.stat().st_size,sourceSha256=m['source']['sha256'],sourceDuration=m['duration'],review=m['review'],photoAssets=m['photoAssets'],qcPassed=qc['passed'],measuredLoudness=qc['loudness'])
          Path('studio/out/delivery.json').write_text(json.dumps(delivery,ensure_ascii=False,indent=2)+'\n')
          Path('studio/out/review-notes.fa.md').write_text('Render review packet: '+run+'\n\nComposition: '+os.environ['COMPOSITION']+'; mode: '+os.environ['MODE']+'\n\nTranscript review: '+json.dumps(m['review'],ensure_ascii=False)+'\n\nSee delivery.json for this exact output. Player photographs are identity illustrations from September 2025, not images of the match. No social-media post has been published.\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: clasico-source-short-${{ github.sha }}
          path: |
            studio/out/CLASICO-SOURCE-SHORT.mp4
            studio/out/CLASICO-SOURCE-COVER.png
            studio/out/CLASICO-SOURCE-SHORT.srt
            studio/out/quality.json
            studio/out/contact-sheet.jpg
            studio/out/posting.en.md
            studio/out/review-notes.fa.md
            studio/out/photo-credits.md
            studio/out/delivery.json
          if-no-files-found: error
          retention-days: 14
